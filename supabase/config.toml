# Configuración del entorno local de Supabase para AnunciaPro.
# Documentación: https://supabase.com/docs/guides/local-development/cli/config
# En producción estos valores se configuran en el panel de Supabase (ver docs/DESPLIEGUE.md).
project_id = "anunciapro"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

# Servidor de correo local (bandeja web en http://127.0.0.1:54324).
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.rate_limit]
# Límite alto solo en local para poder ejecutar las pruebas E2E.
email_sent = 200
token_refresh = 150
sign_in_sign_ups = 300
token_verifications = 300

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirma tu cuenta de AnunciaPro"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Restablece tu contraseña de AnunciaPro"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirma tu nuevo correo en AnunciaPro"
content_path = "./supabase/templates/email_change.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
