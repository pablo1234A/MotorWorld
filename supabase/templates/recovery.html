<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#f6f4ef;font-family:Helvetica,Arial,sans-serif;color:#14171f;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e7e3da;border-radius:14px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 24px;font-size:20px;font-weight:700;letter-spacing:-0.02em;">Anuncia<span style="background:#e8501c;color:#ffffff;border-radius:6px;padding:1px 7px;margin-left:3px;">Pro</span></p>
          <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Restablece tu contraseña</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#4a505c;">Hemos recibido una solicitud para restablecer la contraseña de tu cuenta. Pulsa el botón para elegir una nueva.</p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/restablecer" style="display:inline-block;background:#14171f;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;">Elegir nueva contraseña</a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#7b808a;">Si no has solicitado este correo, puedes ignorarlo con tranquilidad. El enlace caduca en 1 hora.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
