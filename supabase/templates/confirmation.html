<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f4f5f7;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#14161a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <tr><td>
        <p style="margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5b616e">RevisaYa</p>
        <h1 style="margin:0 0 16px;font-size:22px">Confirma tu correo electrónico</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.6">Para activar tu cuenta y empezar a configurar tu taller, confirma que este correo es tuyo.</p>
        <p style="margin:0 0 24px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#1f4fd8;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600">Confirmar correo</a></p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#5b616e">Si no has creado una cuenta en RevisaYa, ignora este mensaje.</p>
      </td></tr>
    </table>
  </body>
</html>
