# Despliegue de referencia en un servidor (VPS). Pon delante un proxy con HTTPS (Caddy/Nginx/Traefik).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: resenalo, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}", POSTGRES_DB: resenalo }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U resenalo"], interval: 10s, retries: 5 }
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { DATABASE_URL: "postgresql://resenalo:${POSTGRES_PASSWORD}@db:5432/resenalo", REDIS_URL: "redis://redis:6379" }
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm start"
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 30s }
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: { DATABASE_URL: "postgresql://resenalo:${POSTGRES_PASSWORD}@db:5432/resenalo", REDIS_URL: "redis://redis:6379", SERVICE_NAME: resenalo-worker }
    command: ["npm", "run", "worker"]
    depends_on: [web]
volumes: { pgdata: {}, redisdata: {} }
