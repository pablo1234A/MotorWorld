<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<div class="chat" id="chat" aria-live="polite">
  <header class="chat-head">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <div class="who">
      <strong id="assistantName">Asistente</strong>
      <span><i class="online"></i><span id="businessName">En línea</span></span>
    </div>
    <span class="demo-badge" id="demoBadge" hidden title="Las reservas se guardan en un calendario de demostración">Demo</span>
    <button class="icon-btn" id="resetBtn" title="Nueva conversación" aria-label="Nueva conversación">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
    </button>
    <button class="icon-btn" id="closeBtn" title="Cerrar" aria-label="Cerrar" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <main class="log" id="log"></main>

  <div class="quick" id="quick"></div>

  <form class="composer" id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Escribe tu mensaje…" aria-label="Mensaje" maxlength="2000"></textarea>
    <button type="submit" id="sendBtn" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <footer class="powered">Reservas con IA · <a href="/" target="_blank" rel="noopener">Agendia</a></footer>
</div>

<div class="unavailable" id="unavailable" hidden>
  <p>Este asistente no está disponible ahora mismo.</p>
</div>
<script src="/chat.js" type="module"></script>
</body>
</html>
