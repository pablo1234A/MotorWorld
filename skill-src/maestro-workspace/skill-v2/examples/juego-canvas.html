<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esquiva — ejemplo de game feel</title>
<style>
html,body{margin:0;height:100%;background:#0B0C10;color:#E8E6E1;font:600 16px system-ui;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
</style>
</head>
<body>
<canvas id="c" aria-label="Juego: mueve el ratón o el dedo para esquivar"></canvas>
<script>
// Ejemplo compacto de "juice": deltaTime, pooling, screen shake, hit-stop, partículas, reintento instantáneo.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr;
function resize(){ dpr = Math.min(devicePixelRatio, 2); W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', resize); resize();

const player = { x: W/2, y: H*0.8, tx: W/2, ty: H*0.8, r: 12 };
const enemies = [], parts = [];
let state = 'menu', score = 0, best = +(localStorage.getItem('best')||0), spawn = 0, shake = 0, hitstop = 0, t = 0;

function pointer(e){ const p = e.touches ? e.touches[0] : e; player.tx = p.clientX; player.ty = p.clientY; }
addEventListener('pointermove', pointer); addEventListener('touchmove', pointer, {passive:true});
addEventListener('pointerdown', e => { pointer(e); if (state !== 'play') start(); });
addEventListener('keydown', e => { if (e.code === 'Space' && state !== 'play') start(); });

function start(){ enemies.length = 0; parts.length = 0; score = 0; spawn = 0; state = 'play'; }
function burst(x, y, n, col){ for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=80+Math.random()*320;
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6+Math.random()*.4,col}); } }

function update(dt){
  t += dt;
  // Seguimiento suave (no instantáneo) = sensación de peso
  const k = 1 - Math.exp(-18*dt);
  player.x += (player.tx-player.x)*k; player.y += (player.ty-player.y)*k;
  for (const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.92; p.vy*=.92; p.life-=dt; }
  for (let i=parts.length-1;i>=0;i--) if (parts[i].life<=0) parts.splice(i,1);
  shake = Math.max(0, shake - dt*40);
  if (state !== 'play') return;
  score += dt*10;
  spawn -= dt;
  const difficulty = 1 + score/120;
  if (spawn <= 0){ spawn = Math.max(.12, .6/difficulty);
    const r = 8+Math.random()*16;
    enemies.push({x:Math.random()*W, y:-r, r, vy:(140+Math.random()*160)*difficulty, vx:(Math.random()-.5)*60}); }
  for (const e of enemies){ e.y += e.vy*dt; e.x += e.vx*dt;
    if (Math.hypot(e.x-player.x, e.y-player.y) < e.r+player.r*.8){ die(); return; } }
  for (let i=enemies.length-1;i>=0;i--) if (enemies[i].y > H+40) enemies.splice(i,1);
}
function die(){ state='over'; shake=18; hitstop=.08; burst(player.x, player.y, 60, '#FF5A3C');
  best = Math.max(best, Math.floor(score)); try{ localStorage.setItem('best', best); }catch{} }

function draw(){
  ctx.save(); ctx.clearRect(0,0,W,H);
  if (shake) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
  ctx.fillStyle = '#FF5A3C';
  for (const e of enemies){ ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,7); ctx.fill(); }
  for (const p of parts){ ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.col; ctx.fillRect(p.x-2,p.y-2,4,4); }
  ctx.globalAlpha=1;
  if (state==='play'){ const s = 1 + Math.sin(t*12)*.06; // respiración sutil
    ctx.fillStyle='#E8E6E1'; ctx.beginPath(); ctx.arc(player.x,player.y,player.r*s,0,7); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle='#E8E6E1'; ctx.textAlign='center';
  if (state==='play'){ ctx.font='600 20px system-ui'; ctx.fillText(Math.floor(score), W/2, 40); }
  else { ctx.font = `700 ${Math.min(64, W*.1)}px system-ui`;
    ctx.fillText(state==='menu'?'ESQUIVA':Math.floor(score)+' pts', W/2, H/2-20);
    ctx.font='500 16px system-ui'; ctx.globalAlpha=.6+Math.sin(t*4)*.3;
    ctx.fillText('Toca o pulsa espacio para '+(state==='menu'?'jugar':'reintentar'), W/2, H/2+24);
    ctx.fillText('Récord: '+best, W/2, H/2+48);
    ctx.globalAlpha=1; }
}

let last = performance.now();
function loop(now){
  let dt = Math.min((now-last)/1000, 1/30); last = now;
  if (hitstop > 0){ hitstop -= dt; dt = 0; }   // hit-stop: congela un instante el impacto
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
