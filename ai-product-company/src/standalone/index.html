<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="description" content="AI Product Company — empresa virtual de agentes de IA. Edición navegador: todo se ejecuta y se guarda en este dispositivo." />
    <title>AI Product Company</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0f11'/%3E%3Cpath d='M16 6 26 24H6L16 6Z' fill='none' stroke='%23ede6da' stroke-width='2.4' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='18' r='2.6' fill='%23e9c46a'/%3E%3C/svg%3E" />
    <style>
      html, body { background: #0e0f11; color: #ede6da; margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
      #boot p { color: #8b867e; font-size: 13px; margin-top: 10px; }
      #boot .bar { width: 160px; height: 2px; background: #23272c; margin: 18px auto 0; overflow: hidden; border-radius: 2px; }
      #boot .bar i { display: block; height: 100%; width: 40%; background: #ede6da; animation: b 1.2s ease-in-out infinite; }
      @keyframes b { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="boot"><div><b style="letter-spacing:.08em">AI PRODUCT COMPANY</b><p>Abriendo la oficina…</p><div class="bar"><i></i></div></div></div>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
