<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="VÉRTICE: Frente Urbano — FPS táctico original para móvil y navegador, con IA por niveles, cuatro modos y progresión.">
<title>VÉRTICE · Frente Urbano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VÉRTICE · identidad visual: grafito profundo, ámbar de señalización, tipografía técnica */
:root {
  --bg: #07090c; --panel: rgba(13, 16, 21, 0.78); --panel2: rgba(20, 24, 31, 0.9); --line: rgba(255, 255, 255, 0.09); --line2: rgba(255, 255, 255, 0.18);
  --text: #e9edf2; --muted: #8a94a2; --amber: #ffb000; --amber2: #ffcf5a; --ally: #3fa7ff; --enemy: #ff4d3a; --ok: #3ddc97;
  --fd: 'Rajdhani', 'Arial Narrow', sans-serif; --fb: 'Inter', system-ui, sans-serif; --fm: 'JetBrains Mono', ui-monospace, monospace;
  --hud: 1;
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px); --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--fb); overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.hidden { display: none !important; }
#fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--bg); z-index: 99; font-family: var(--fd); font-size: 22px; }

/* ===================================================================== MENÚS */
.menu-layer { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: calc(14px + var(--safe-t)) calc(18px + var(--safe-r)) calc(12px + var(--safe-b)) calc(18px + var(--safe-l)); background: linear-gradient(90deg, rgba(7, 9, 12, 0.96) 0%, rgba(7, 9, 12, 0.72) 36%, rgba(7, 9, 12, 0.1) 62%, rgba(7, 9, 12, 0.55) 100%); touch-action: pan-y; overflow: hidden; }
.menu-layer::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px); }
.menu-layer.scr-title { background: radial-gradient(ellipse at 70% 40%, rgba(255, 176, 0, 0.06), transparent 60%), linear-gradient(180deg, rgba(7, 9, 12, 0.5), rgba(7, 9, 12, 0.92)); }
.menu-layer.scr-loading, .menu-layer.scr-results { background: rgba(7, 9, 12, 0.94); }
.menu-layer.scr-pause { background: rgba(5, 7, 10, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); align-items: center; justify-content: center; }
.logo-mark { width: 1em; height: 1em; color: var(--text); flex: none; }
.chip { font-family: var(--fm); font-size: 10.5px; letter-spacing: 0.08em; padding: 4px 8px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }

/* título */
.t-wrap { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 4vh; text-align: center; position: relative; z-index: 1; }
.t-logo { display: flex; flex-direction: column; align-items: center; animation: rise 1s cubic-bezier(.2, .8, .2, 1) both; }
.t-logo .logo-mark { font-size: clamp(56px, 12vh, 110px); filter: drop-shadow(0 0 30px rgba(255, 176, 0, 0.18)); }
.t-logo h1 { font-family: var(--fd); font-weight: 700; font-size: clamp(54px, 14vh, 128px); letter-spacing: 0.22em; line-height: 0.9; margin-top: 1vh; padding-left: 0.22em; }
.t-logo p { font-family: var(--fm); letter-spacing: 0.6em; color: var(--amber); font-size: clamp(11px, 2vh, 15px); padding-left: 0.6em; }
.t-load { width: min(360px, 70vw); display: flex; flex-direction: column; gap: 8px; transition: opacity .4s; }
.t-load.ready { opacity: 0; }
.t-load > i { display: block; height: 2px; background: var(--line); }
.t-load > i > i { display: block; height: 100%; background: var(--amber); transition: width .2s; }
.t-load span { font-family: var(--fm); font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }
.t-start { font-family: var(--fd); font-weight: 700; font-size: clamp(16px, 3vh, 22px); letter-spacing: 0.3em; padding: 14px 34px; border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.03); animation: pulse 2.2s ease-in-out infinite; }
.t-start:disabled { opacity: .45; animation: none; }
.t-foot { font-size: 11px; color: var(--muted); max-width: 520px; line-height: 1.5; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@keyframes pulse { 50% { border-color: var(--amber); color: var(--amber2); } }

/* principal */
.m-main { position: relative; z-index: 1; flex: 1; display: grid; grid-template-columns: minmax(250px, 30%) 1fr minmax(220px, 24%); gap: 16px; min-height: 0; }
.m-side { display: flex; flex-direction: column; gap: 2.2vh; min-height: 0; }
.m-logo { display: flex; align-items: center; gap: 12px; }
.m-logo .logo-mark { font-size: 46px; }
.m-logo h1 { font-family: var(--fd); font-size: 34px; letter-spacing: 0.18em; line-height: 1; }
.m-logo span { font-family: var(--fm); font-size: 10px; color: var(--amber); letter-spacing: 0.4em; }
.m-nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; }
.m-nav button { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; text-align: left; padding: clamp(6px, 1.5vh, 13px) 14px; border-left: 2px solid transparent; transition: background .15s, border-color .15s, padding .2s; }
.m-nav button b { font-family: var(--fd); font-size: clamp(20px, 4.4vh, 32px); letter-spacing: 0.08em; line-height: 1; }
.m-nav button span { font-family: var(--fm); font-size: 10px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; }
.m-nav button:hover, .m-nav button:focus-visible { background: linear-gradient(90deg, rgba(255, 255, 255, 0.07), transparent); border-color: var(--text); padding-left: 20px; outline: none; }
.m-nav button.primary { background: linear-gradient(90deg, rgba(255, 176, 0, 0.18), transparent 80%); border-color: var(--amber); }
.m-nav button.primary b { color: var(--amber2); }
.m-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.m-stage { min-height: 0; cursor: grab; }
.m-card { align-self: end; background: var(--panel); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.pc-name small, .pc-lo small, .pc-stats small { font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.14em; color: var(--muted); display: block; }
.pc-n { font-family: var(--fd); font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-align: left; border-bottom: 1px dashed var(--line2); }
.pc-in { font-family: var(--fd); font-size: 22px; font-weight: 700; letter-spacing: 0.06em; width: 100%; background: transparent; color: var(--text); border: 0; border-bottom: 1px solid var(--amber); outline: none; text-transform: uppercase; }
.pc-op b { font-family: var(--fd); font-size: 18px; letter-spacing: 0.1em; }
.pc-op span { display: block; color: var(--muted); font-size: 12px; }
.pc-lo { display: grid; gap: 6px; }
.pc-lo b { font-family: var(--fd); font-size: 16px; letter-spacing: 0.04em; }
.pc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.pc-stats b { font-family: var(--fd); font-size: 22px; }
.m-lvl { display: flex; align-items: center; gap: 10px; }
.m-lvl > b { font-family: var(--fd); font-size: 22px; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--amber); color: var(--amber2); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: rgba(255, 176, 0, 0.08); }
.m-lvl div { flex: 1; min-width: 90px; }
.m-lvl span { font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.16em; color: var(--muted); }
.m-lvl i { display: block; height: 3px; background: var(--line); margin-top: 4px; }
.m-lvl i i { height: 100%; background: var(--amber); }

/* cabecera de sub-pantalla */
.m-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.m-back { font-size: 30px; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line2); line-height: 1; }
.m-brand { display: none; }
.m-title small { font-family: var(--fm); font-size: 10px; letter-spacing: 0.24em; color: var(--amber); }
.m-title h2 { font-family: var(--fd); font-size: clamp(22px, 4.6vh, 34px); letter-spacing: 0.1em; line-height: 1; }
.m-head .m-lvl { margin-left: auto; width: 180px; }
.m-body { position: relative; z-index: 1; flex: 1; min-height: 0; padding: 12px 0; }
.m-foot { position: relative; z-index: 1; display: flex; justify-content: flex-end; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.cta, .ghost, .danger { font-family: var(--fd); font-weight: 700; font-size: 17px; letter-spacing: 0.14em; padding: 11px 22px; border: 1px solid var(--line2); transition: background .15s, transform .1s; }
.cta { background: var(--amber); color: #111; border-color: var(--amber); clip-path: polygon(0 0, 100% 0, 100% 70%, calc(100% - 12px) 100%, 0 100%); }
.cta:hover { background: var(--amber2); }
.cta:active, .ghost:active { transform: scale(0.97); }
.ghost:hover { background: rgba(255, 255, 255, 0.06); }
.danger { color: var(--enemy); border-color: rgba(255, 77, 58, 0.5); }
.tabs { position: relative; z-index: 1; display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { font-family: var(--fd); font-weight: 600; font-size: 14px; letter-spacing: 0.12em; padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-color: var(--amber); background: linear-gradient(0deg, rgba(255, 176, 0, 0.1), transparent); }

/* modos */
.m-modes { display: grid; grid-template-columns: 1.05fr 1fr; gap: 16px; overflow-y: auto; }
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.mode-card { text-align: left; padding: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-height: 100px; transition: border-color .15s, background .15s; position: relative; overflow: hidden; }
.mode-card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: transparent; }
.mode-card small { font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.16em; color: var(--muted); }
.mode-card b { font-family: var(--fd); font-size: 21px; letter-spacing: 0.06em; line-height: 1.05; }
.mode-card span { font-size: 12px; color: #b9c1cc; line-height: 1.35; }
.mode-card em { font-style: normal; font-family: var(--fm); font-size: 9.5px; color: var(--amber); margin-top: auto; letter-spacing: 0.08em; }
.mode-card.on { border-color: var(--amber); background: linear-gradient(135deg, rgba(255, 176, 0, 0.14), var(--panel) 60%); }
.mode-card.on::before { background: var(--amber); }
.opts { display: flex; flex-wrap: wrap; gap: 12px; align-content: start; }
.opt { width: 100%; }
.opt.half { width: calc(50% - 6px); }
.opt.disabled { opacity: 0.35; pointer-events: none; }
.opt label, .set label { font-family: var(--fm); font-size: 10.5px; letter-spacing: 0.14em; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 6px; }
.seg { display: flex; gap: 2px; flex-wrap: wrap; }
.seg button { flex: 1; font-family: var(--fd); font-weight: 700; font-size: 14px; letter-spacing: 0.1em; padding: 9px 8px; background: var(--panel); border: 1px solid var(--line); min-width: 64px; }
.seg button.on { border-color: var(--amber); color: var(--amber2); background: rgba(255, 176, 0, 0.1); }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 6px; }

/* listas de selección (equipamiento / personalización) */
.m-split { display: grid; grid-template-columns: minmax(220px, 28%) 1fr minmax(220px, 27%); gap: 14px; }
.list { overflow-y: auto; display: flex; flex-direction: column; gap: 3px; min-height: 0; padding-right: 4px; touch-action: pan-y; }
.it { text-align: left; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-left: 2px solid transparent; position: relative; transition: background .12s; }
.it b { display: block; font-family: var(--fd); font-size: 17px; letter-spacing: 0.06em; }
.it span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.3; padding-right: 26px; }
.it.on { border-left-color: var(--amber); background: linear-gradient(90deg, rgba(255, 176, 0, 0.14), var(--panel)); }
.it.locked { opacity: 0.55; }
.it .sw { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border: 1px solid var(--line2); }
.side { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.det { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
.det small { font-family: var(--fm); font-size: 10px; color: var(--amber); letter-spacing: 0.16em; }
.det h3 { font-family: var(--fd); font-size: 26px; letter-spacing: 0.06em; margin: 2px 0 10px; line-height: 1; }
.det p { font-size: 13px; color: #c3cad3; line-height: 1.5; }
.bar { display: grid; grid-template-columns: 82px 1fr; align-items: center; gap: 8px; margin-bottom: 6px; }
.bar span { font-family: var(--fm); font-size: 9.5px; letter-spacing: 0.12em; color: var(--muted); }
.bar > i { height: 4px; background: var(--line); display: block; }
.bar > i > i { display: block; height: 100%; background: linear-gradient(90deg, var(--text), var(--amber2)); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.kv b { color: var(--text); font-family: var(--fd); font-size: 15px; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--panel); border: 1px solid var(--line); padding: 12px; }
.sum small { font-family: var(--fm); font-size: 9px; letter-spacing: 0.14em; color: var(--muted); display: block; }
.sum b { font-family: var(--fd); font-size: 14px; letter-spacing: 0.04em; }
.accents { padding: 10px 2px; }
.accents small { font-family: var(--fm); font-size: 10px; color: var(--muted); letter-spacing: 0.12em; }
.accents div { display: flex; gap: 8px; margin-top: 8px; }
.acc { width: 34px; height: 34px; background: var(--c); border: 2px solid transparent; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.acc.on { border-color: #fff; transform: scale(1.12); }
.toast { position: absolute; left: 50%; bottom: 70px; transform: translate(-50%, 20px); background: var(--panel2); border: 1px solid var(--line2); padding: 10px 16px; font-family: var(--fd); letter-spacing: 0.08em; opacity: 0; transition: .25s; pointer-events: none; z-index: 5; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ajustes */
.m-settings { overflow-y: auto; touch-action: pan-y; }
.sets { max-width: 640px; display: flex; flex-direction: column; gap: 14px; padding-right: 6px; }
.set.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.set.row label { margin: 0; flex-direction: column; gap: 2px; text-transform: none; }
.set.row label small { font-family: var(--fb); letter-spacing: 0; font-size: 11px; color: #6b7480; }
.set label b { color: var(--text); font-family: var(--fd); font-size: 15px; letter-spacing: 0.04em; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; touch-action: pan-x; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--line2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7.5px; background: var(--amber); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
input[type=range]::-moz-range-track { height: 3px; background: var(--line2); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--amber); border: 0; border-radius: 0; }
.tog { width: 48px; height: 26px; border: 1px solid var(--line2); position: relative; flex: none; }
.tog i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; background: var(--muted); transition: .2s; }
.tog.on { border-color: var(--amber); }
.tog.on i { left: 25px; background: var(--amber); }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.keys div { display: flex; gap: 10px; align-items: center; font-size: 13px; color: #c3cad3; }
kbd { font-family: var(--fm); font-size: 11px; padding: 3px 7px; border: 1px solid var(--line2); background: rgba(255, 255, 255, 0.04); min-width: 70px; text-align: center; }

/* estadísticas */
.m-stats { overflow-y: auto; touch-action: pan-y; display: flex; flex-direction: column; gap: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }
.st { background: var(--panel); border: 1px solid var(--line); padding: 10px; }
.st b { display: block; font-family: var(--fd); font-size: 26px; line-height: 1; }
.st small { font-family: var(--fm); font-size: 9px; color: var(--muted); letter-spacing: 0.14em; }
.cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
.cols h4, .xp h4, .unl h4 { font-family: var(--fm); font-size: 10.5px; letter-spacing: 0.18em; color: var(--amber); margin: 4px 0 8px; }
.ch { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 5px; }
.ch div b { font-family: var(--fd); font-size: 16px; letter-spacing: 0.05em; }
.ch div span { display: block; font-size: 12px; color: var(--muted); }
.ch > i { display: block; height: 3px; background: var(--line); margin: 8px 0 4px; }
.ch > i > i { display: block; height: 100%; background: var(--amber); }
.ch em { font-style: normal; font-family: var(--fm); font-size: 10px; color: var(--muted); }
.ch.done { border-color: rgba(61, 220, 151, 0.4); }
.ch.done em { color: var(--ok); }
.wk { display: flex; justify-content: space-between; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 4px; font-family: var(--fd); letter-spacing: 0.05em; }

/* carga */
.ld { position: relative; z-index: 1; margin: auto; width: min(760px, 92vw); display: flex; flex-direction: column; gap: 4vh; }
.ld-map small { font-family: var(--fm); font-size: 11px; letter-spacing: 0.3em; color: var(--amber); }
.ld-map h1 { font-family: var(--fd); font-size: clamp(42px, 11vh, 92px); letter-spacing: 0.12em; line-height: 0.95; }
.ld-map p { color: var(--muted); max-width: 560px; font-size: 14px; line-height: 1.5; margin: 6px 0 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.ld-bar > i { display: block; height: 3px; background: var(--line); }
.ld-bar > i > i { display: block; height: 100%; width: 0; background: var(--amber); transition: width .25s; box-shadow: 0 0 12px rgba(255, 176, 0, 0.6); }
.ld-bar span { display: block; margin-top: 8px; font-family: var(--fm); font-size: 11px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; }
.ld-tip { font-size: 13px; color: #b4bcc7; line-height: 1.5; border-left: 2px solid var(--amber); padding-left: 12px; }
.ld-tip b { font-family: var(--fm); font-size: 10px; letter-spacing: 0.2em; color: var(--amber); margin-right: 6px; }

/* resultados */
.rs { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.rs-banner { text-align: center; padding: 1vh 0 1.5vh; border-bottom: 1px solid var(--line); }
.rs-banner small { font-family: var(--fm); font-size: 10.5px; letter-spacing: 0.22em; color: var(--muted); }
.rs-banner h1 { font-family: var(--fd); font-size: clamp(44px, 12vh, 96px); letter-spacing: 0.24em; line-height: 0.95; padding-left: 0.24em; animation: rise .6s both; }
.rs.win h1 { color: var(--amber2); text-shadow: 0 0 40px rgba(255, 176, 0, 0.35); }
.rs.loss h1 { color: var(--enemy); text-shadow: 0 0 40px rgba(255, 77, 58, 0.3); }
.rs-banner p { color: var(--muted); font-size: 13px; }
.rs-score { display: flex; justify-content: center; align-items: center; gap: 16px; font-family: var(--fd); margin-top: 4px; }
.rs-score b { font-size: 34px; }
.rs-score .a { color: var(--ally); } .rs-score .e { color: var(--enemy); }
.rs-score span { color: var(--muted); }

/* ===================================================================== HUD */

.h-mm { position: absolute; top: calc(8px + var(--safe-t)); left: calc(10px + var(--safe-l)); transform: scale(var(--hud)); transform-origin: top left; }

.h-pop { position: absolute; left: 50%; top: 60%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }

.tt-x { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-size: 18px; letter-spacing: 0.24em; color: #fff; animation: pulse2 1.4s infinite; }
.tt-keys { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel2); border: 1px solid var(--line2); padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; font-family: var(--fb); font-size: 13px; color: #d7dde4; text-shadow: none; }
.tt-keys h4 { font-family: var(--fm); font-size: 11px; letter-spacing: 0.2em; color: var(--amber); }
.tt-keys .tt-x { position: static; transform: none; margin-top: 8px; text-align: center; font-family: var(--fd); }

/* ===================================================================== CONTROLES TÁCTILES */
#touch { position: fixed; inset: 0; z-index: 12; pointer-events: none; }
body:not(.ingame) #touch { display: none !important; }
#touch .tbtn, #touch .joy-zone { pointer-events: auto; }
.joy-zone { position: absolute; left: 0; top: 18%; bottom: 0; width: 42%; pointer-events: none !important; }
.joy { position: absolute; left: calc(170px + var(--safe-l)); top: calc(100% - 110px - var(--safe-b)); width: calc(124px * var(--hud)); height: calc(124px * var(--hud)); margin: calc(-62px * var(--hud)) 0 0 calc(-62px * var(--hud)); border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.18); background: radial-gradient(circle, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02)); opacity: 0.55; transition: opacity .15s; }
.joy.active { opacity: 1; transition: none; }
.joy-knob { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; border-radius: 50%; background: rgba(255, 255, 255, 0.28); border: 1.5px solid rgba(255, 255, 255, 0.55); transform: translate(-50%, -50%); box-shadow: 0 0 12px rgba(0, 0, 0, 0.4); }
.tbtn { position: absolute; width: calc(58px * var(--hud)); height: calc(58px * var(--hud)); border-radius: 50%; display: grid; place-items: center; background: rgba(12, 15, 20, 0.42); border: 1.5px solid rgba(255, 255, 255, 0.28); color: rgba(255, 255, 255, 0.92); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); touch-action: none; transition: transform .06s, background .06s; }
.tbtn svg { width: 52%; height: 52%; }
.tbtn.on { transform: scale(0.92); background: rgba(255, 255, 255, 0.28); border-color: #fff; }
.tbtn .cnt { position: absolute; right: -2px; top: -2px; font-family: var(--fm); font-size: 10px; background: #111; border: 1px solid var(--line2); border-radius: 8px; padding: 0 4px; }
.tbtn.fire { right: calc(30px + var(--safe-r)); bottom: calc(104px * var(--hud) + var(--safe-b)); width: calc(86px * var(--hud)); height: calc(86px * var(--hud)); border-color: rgba(255, 176, 0, 0.7); color: var(--amber2); background: rgba(40, 28, 0, 0.35); }
.tbtn.fire.on { background: rgba(255, 176, 0, 0.35); }
.tbtn.fire2 { left: calc(22px + var(--safe-l)); top: calc(214px * var(--hud) + var(--safe-t)); width: calc(60px * var(--hud)); height: calc(60px * var(--hud)); border-color: rgba(255, 176, 0, 0.6); color: var(--amber2); display: none; }
#touch.left-fire .tbtn.fire2 { display: grid; }
.tbtn.ads { right: calc(128px * var(--hud) + var(--safe-r)); bottom: calc(166px * var(--hud) + var(--safe-b)); width: calc(64px * var(--hud)); height: calc(64px * var(--hud)); }
.tbtn.jump { right: calc(24px + var(--safe-r)); bottom: calc(24px + var(--safe-b)); }
.tbtn.crouch { right: calc(96px * var(--hud) + var(--safe-r)); bottom: calc(16px + var(--safe-b)); }
.tbtn.reload { right: calc(168px * var(--hud) + var(--safe-r)); bottom: calc(30px + var(--safe-b)); width: calc(54px * var(--hud)); height: calc(54px * var(--hud)); }
.tbtn.sprint { right: calc(142px * var(--hud) + var(--safe-r)); bottom: calc(96px * var(--hud) + var(--safe-b)); width: calc(52px * var(--hud)); height: calc(52px * var(--hud)); }
.tbtn.lethal { right: calc(30px + var(--safe-r)); bottom: calc(212px * var(--hud) + var(--safe-b)); width: calc(52px * var(--hud)); height: calc(52px * var(--hud)); }
.tbtn.tactical { right: calc(92px * var(--hud) + var(--safe-r)); bottom: calc(236px * var(--hud) + var(--safe-b)); width: calc(50px * var(--hud)); height: calc(50px * var(--hud)); }
.tbtn.interact { right: calc(210px * var(--hud) + var(--safe-r)); bottom: calc(170px * var(--hud) + var(--safe-b)); width: auto; min-width: calc(92px * var(--hud)); height: calc(44px * var(--hud)); border-radius: 22px; padding: 0 14px; font-family: var(--fd); font-weight: 700; font-size: 13px; letter-spacing: 0.1em; border-color: var(--amber); color: var(--amber2); --p: 0; }
.tbtn.interact .ring { position: absolute; left: 0; bottom: -1px; height: 3px; width: calc(var(--p) * 1%); background: var(--amber); border-radius: 2px; }

/* rotación */
#rotate { display: none; }
@media (orientation: portrait) and (pointer: coarse) {
  #rotate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: var(--bg); text-align: center; }
  #rotate div { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #rotate svg { animation: rot 2s ease-in-out infinite; }
  #rotate b { font-family: var(--fd); font-size: 24px; letter-spacing: 0.16em; }
  #rotate span { font-size: 13px; color: var(--muted); }
  @keyframes rot { 50% { transform: rotate(-90deg); } }
}

/* pantallas bajas (móvil apaisado) */
@media (max-height: 460px) {
  .menu-layer { padding-top: calc(8px + var(--safe-t)); padding-bottom: calc(6px + var(--safe-b)); }
  .m-main { grid-template-columns: minmax(220px, 34%) 1fr minmax(200px, 30%); }
  .m-logo .logo-mark { font-size: 34px; } .m-logo h1 { font-size: 26px; }
  .m-card { padding: 10px; gap: 8px; }
  .pc-stats b { font-size: 18px; }
  .pc-lo { display: none; }
  .mode-card { min-height: 78px; padding: 8px 10px; } .mode-card b { font-size: 17px; } .mode-card span { font-size: 11px; }
  .m-modes { grid-template-columns: 1fr 1fr; }
  .opt label { margin-bottom: 4px; } .seg button { padding: 7px 6px; font-size: 13px; }
  .hint { font-size: 11px; }
  .m-split { grid-template-columns: minmax(190px, 32%) 1fr minmax(190px, 30%); gap: 10px; }
  .it { padding: 7px 10px; } .it b { font-size: 15px; }
  .det { padding: 10px; } .det h3 { font-size: 20px; margin-bottom: 6px; }
  .sum { display: none; }
  .cta, .ghost, .danger { font-size: 15px; padding: 8px 16px; }
  .tabs button { padding: 6px 10px; font-size: 13px; }
  .m-head { padding-bottom: 6px; }
  .rs-banner h1 { font-size: 44px; }
  .h-notice b { font-size: 26px; }
}
@media (max-width: 760px) and (orientation: landscape) {
  .m-split { grid-template-columns: minmax(170px, 38%) 1fr; }
  .m-split .side { display: none; }
  .m-main { grid-template-columns: minmax(210px, 42%) 1fr; }
  .m-card { display: none; }
  .m-modes { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
