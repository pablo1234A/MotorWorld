name: Presupio

on:
  push:
    paths: ["presupio/**", ".github/workflows/presupio.yml"]
  pull_request:
    paths: ["presupio/**", ".github/workflows/presupio.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presupio
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Credenciales efímeras del contenedor de CI (no pertenecen a ningún entorno real).
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://presupio_app:ci_app@localhost:5432/presupio_test
      TEST_MIGRATION_DATABASE_URL: postgres://presupio_owner:ci_owner@localhost:5432/presupio_test
    steps:
      # v7: ejecutan sobre Node 24 (las v4 usaban Node 20, obsoleto en GitHub Actions).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presupio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run db:bootstrap
      # Pruebas con cobertura: fallan si baja de los umbrales (vitest.config.ts, vite.config.ts).
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
        working-directory: presupio/apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: presupio/apps/web/test-results
          retention-days: 7

  # La misma batería E2E en los demás motores: Firefox (Gecko), WebKit (Safari) y Microsoft Edge.
  navegadores:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit, msedge]
    defaults:
      run:
        working-directory: presupio
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://presupio_app:ci_app@localhost:5432/presupio_test
      TEST_MIGRATION_DATABASE_URL: postgres://presupio_owner:ci_owner@localhost:5432/presupio_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: presupio/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run db:bootstrap
      # Cómo resuelve «localhost» el ejecutor (diagnóstico: las E2E usan 127.0.0.1 a propósito).
      - run: getent ahosts localhost || true
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: presupio/apps/web
      - run: npx playwright test --project=${{ matrix.browser == 'msedge' && 'edge' || matrix.browser }}
        working-directory: presupio/apps/web
      - name: Registros de la API de pruebas (solo si falla)
        if: failure()
        run: tail -n 60 apps/web/e2e/.output/api.log apps/web/e2e/.output/api-billing.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: presupio/apps/web/test-results
          retention-days: 7
