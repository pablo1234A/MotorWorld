name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: motorworld_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r backend/requirements-dev.txt
      - name: Unit + API tests (SQLite, in-memory limiter)
        working-directory: backend
        run: python -m pytest -q
      - name: Same suite on PostgreSQL + Redis
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/motorworld_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: python -m pytest -q
      - name: Migrations apply cleanly
        working-directory: backend
        env: { DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/motorworld_test" }
        run: |
          psql postgresql://postgres:postgres@localhost:5432/motorworld_test -c "drop schema public cascade; create schema public;"
          alembic upgrade head

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: motorworld }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/motorworld
      REDIS_URL: redis://localhost:6379/0
      QUEUE_MODE: arq
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-0000
      STORAGE_LOCAL_PATH: /tmp/mw/storage
      TMP_DIR: /tmp/mw/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements-dev.txt
      - run: cd backend && ../.venv/bin/alembic upgrade head
      - run: cd frontend && npm ci && npm run typecheck && npm run build && npx playwright install --with-deps chromium
      - run: WITH_WEB=1 ENV_FILE=/dev/null scripts/local_stack.sh start && sleep 6
      - name: API integration (distributed workers)
        run: .venv/bin/python backend/scripts/integration_test.py --base http://localhost:8000
      - name: Browser E2E
        run: cd frontend && npx playwright test
      - if: failure()
        run: tail -n 200 backend/data/run/*.log
