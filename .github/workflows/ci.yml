name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests unitarios
        run: pnpm test:unit

      - name: Supabase local
        run: pnpm db:start
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws

      - name: Migraciones desde cero
        run: pnpm db:reset

      - name: Tests de base de datos (pgTAP — RLS, límites, integridad)
        run: pnpm db:test

      - name: Tests de integración (concurrencia, contexto RLS)
        run: pnpm test:integration

      - name: Variables de entorno locales (Supabase de CI, valores no secretos)
        run: |
          pnpm exec supabase status -o json > "$RUNNER_TEMP/supabase.json"
          {
            echo "APP_ENV=local"
            echo "APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/supabase.json")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/supabase.json")"
            echo "DATABASE_URL=$(jq -r .DB_URL "$RUNNER_TEMP/supabase.json")"
            # Correo real hacia Mailpit (SMTP del contenedor local) y secretos
            # efímeros generados en cada ejecución (no son credenciales reales).
            echo "EMAIL_PROVIDER=smtp"
            echo "SMTP_URL=$(pnpm -s mailpit:smtp-url)"
            echo "EMAIL_SHARED_DOMAIN=avisos.revisaya.test"
            echo "EMAIL_LINK_SECRET=$(openssl rand -hex 32)"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "RESEND_WEBHOOK_SECRET=whsec_$(openssl rand -base64 32)"
          } > .env.local

      - name: Build
        run: pnpm build

      - name: Navegador para E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests E2E (registro, invitaciones, taller, importación, avisos por correo)
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Auditoría de dependencias
        run: pnpm audit --prod --audit-level high

      - name: Detección de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
