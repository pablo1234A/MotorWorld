name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tipos y lint
        run: pnpm typecheck && pnpm lint

      - name: Pruebas unitarias
        run: pnpm test

      - name: Supabase local (migraciones + Auth + Storage + correo)
        run: pnpm exec supabase start -x studio,realtime,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta

      - name: Variables de entorno de pruebas
        run: |
          pnpm exec supabase status -o env > supabase.env
          set -a; source supabase.env; set +a
          {
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PAYMENTS_ENABLED=false"
            echo "CRON_SECRET=ci-cron-secret"
          } > .env.local

      - name: Build de producción
        run: pnpm build

      - name: Arrancar la aplicación
        run: |
          pnpm start -H 127.0.0.1 -p 3000 &
          npx --yes wait-on http://127.0.0.1:3000/api/health

      - name: Pruebas de integración
        run: pnpm test:integration

      - name: Navegador para E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas E2E
        run: pnpm test:e2e --trace off

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
