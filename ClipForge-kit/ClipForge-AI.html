      sc.onpointermove = e => { if (drag) this.prev.seekOut(at(e)); };
      sc.onpointerup = () => drag = false;
    } catch (e) { const b = $('#pv-busy'); if (b) b.textContent = errInfo(e).title; }
  },
  time(o, t) {
    const tot = this.prev?.total || 1, p = clamp(o / tot, 0, 1) * 100;
    const f = $('#pv-fill'), k = $('#pv-knob'), tm = $('#pv-time');
    if (f) f.style.width = p + '%'; if (k) k.style.left = p + '%'; if (tm) tm.textContent = `${fmtTime(o, true)} / ${fmtTime(tot, true)}`;
    const now = Date.now(); if (now - (this._wt || 0) < 120) return; this._wt = now;
    const ws = $$('#words input'); let cur = null;
    for (const w of ws) { const s = +w.dataset.s; if (s <= t + 0.02) cur = w; }
    ws.forEach(w => w.classList.toggle('now', w === cur));
  },
  drawPanel() {
    const box = $('#ed-panel'), c = this.clip, j = this.job; if (!box || !c) return;
    const s = c.settings, f = c.factors || {}, words = clipWords(j, c);
    const dur = keptDuration(keepIntervals(words, c.start, c.end, s.removeSilence));
    const FN = [['hook', 'Fuerza del inicio'], ['narrative', 'Claridad narrativa'], ['interest', 'Interés del contenido'], ['development', 'Calidad del desarrollo'], ['standalone', 'Se entiende solo'], ['retention', 'Potencial de retención'], ['technical', 'Calidad técnica'], ['cuts', 'Sin cortes abruptos']];
    const editable = !!j.source.fileId && !Queue.busyWith(j.id);
    const num = (id, v, step) => `<div class="num"><button data-ed="nudge" data-f="${id}" data-d="${-step}" aria-label="Restar">−</button><input id="${id}" value="${v.toFixed(2)}" inputmode="decimal" aria-label="${id === 'e-start' ? 'Inicio' : 'Final'}"><button data-ed="nudge" data-f="${id}" data-d="${step}" aria-label="Sumar">+</button></div>`;
    box.innerHTML = `
      <div class="card">
        <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px"><div class="ring" style="--v:${c.score};width:44px;height:44px"><b style="width:36px;height:36px;font-size:13px">${c.score}</b></div>
          <div style="min-width:0"><span class="badge live" style="margin-bottom:6px">${esc(c.type)}</span><p class="reason">${esc(c.reason)}</p></div></div>
        ${c.deviation ? `<div class="notice" style="margin-bottom:12px">${icon('info', 'sm')}<div>${esc(c.deviation)}</div></div>` : ''}
        ${c.error ? `<div class="notice" style="margin-bottom:12px;background:var(--err-soft);border-color:rgba(255,107,107,.25);color:#FFC9C9">${icon('alert', 'sm')}<div>${esc(c.error)}</div></div>` : ''}
        <details><summary class="hint" style="cursor:pointer">Ver desglose de la puntuación</summary><div class="bars" style="margin-top:12px">${FN.map(([k, l]) => `<div class="bar"><span>${l}</span><div class="b"><i style="width:${Math.round((f[k] || 0) * 100)}%"></i></div><span class="tnum">${Math.round((f[k] || 0) * 100)}</span></div>`).join('')}</div></details>
      </div>
      <div class="card">
        <h3 class="h" style="margin-bottom:12px">${icon('clock', 'sm')} Recorte</h3>
        <div class="kv"><div class="field"><span class="label">Inicio</span>${num('e-start', c.start, 0.25)}</div><div class="field"><span class="label">Final</span>${num('e-end', c.end, 0.25)}</div></div>
        <div style="display:flex;gap:8px;align-items:flex-end;margin-top:10px"><div class="field" style="flex:1"><label class="label" for="e-target">Duración objetivo (s)</label><input class="input" id="e-target" type="number" min="5" max="600" value="${Math.round(dur)}"></div><button class="btn" data-ed="refit" ${editable ? '' : 'disabled'}>Reajustar a frases</button></div>
        <p class="hint" style="margin:10px 0 0">Duración real del clip: <b class="tnum" style="color:var(--text)">${dur.toFixed(1)} s</b>${s.removeSilence && c.end - c.start - dur > 0.3 ? ` (se eliminan ${(c.end - c.start - dur).toFixed(1)} s de silencios)` : ''}. Los límites se ajustan a palabras completas.</p>
        <div class="opt-row" style="margin-top:8px"><div class="txt"><b>Eliminar silencios largos</b></div><label class="switch"><input type="checkbox" id="e-sil" ${s.removeSilence ? 'checked' : ''}><span></span></label></div>
        <div class="opt-row"><div class="txt"><b>Normalizar audio y reducir ruido</b></div><label class="switch"><input type="checkbox" id="e-norm" ${s.normalize ? 'checked' : ''}><span></span></label></div>
      </div>
      <div class="card">
        <h3 class="h" style="margin-bottom:12px">${icon('crop', 'sm')} Encuadre</h3>
        <div class="seg" style="margin-bottom:10px">${Object.keys(ASPECTS).map(k => `<button class="chip ${s.aspect === k ? 'on' : ''}" data-ed="aspect" data-v="${k}">${k}</button>`).join('')}</div>
        <div class="seg">${[['auto', 'Automático'], ['center', 'Centro'], ['manual', 'Manual'], ['blur', 'Fondo desenfocado']].map(([k, l]) => `<button class="chip ${s.framing === k ? 'on' : ''}" data-ed="framing" data-v="${k}">${l}</button>`).join('')}</div>
        ${s.framing === 'manual' ? `<div class="field" style="margin-top:12px"><label class="label" for="e-off">Posición horizontal</label><input type="range" id="e-off" min="-1" max="1" step="0.01" value="${s.offsetX || 0}"></div>` : ''}
        <p class="hint" style="margin:10px 0 0">${s.framing === 'auto' ? (c.track?.mode === 'follow' ? `Siguiendo al rostro principal (detectado en el ${Math.round(c.track.faceRatio * 100)} % del clip).` : c.track === undefined ? 'Se analizará el encuadre al exportar.' : c.track?.mode === 'nofaces' ? 'Sin rostros claros: se usa el vídeo completo sobre fondo desenfocado cuando recortar perdería información.' : 'El formato coincide con la fuente: sin recorte.') : s.framing === 'blur' ? 'Se conserva el plano completo sobre un fondo ampliado y desenfocado.' : 'Recorte fijo.'}</p>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><h3 class="h">${icon('cc', 'sm')} Subtítulos</h3><label class="switch"><input type="checkbox" id="e-caps" ${s.captions ? 'checked' : ''}><span></span></label></div>
        <div class="style-grid">${Object.entries(CAPTION_STYLES).map(([k, st]) => `<button class="style-opt ${s.style === k ? 'on' : ''}" data-ed="style" data-v="${k}" style="font-family:${st.family};font-weight:${st.weight};color:${st.active || st.spoken || st.fill};${st.stroke ? `-webkit-text-stroke:${st.strokeW > .15 ? 1.2 : .5}px ${st.stroke};` : ''}"><span>${st.upper ? 'HOLA' : 'Hola'}</span><small>${st.name}</small></button>`).join('')}</div>
        <div class="field" style="margin-top:12px"><label class="label" for="e-capy">Posición vertical <span class="faint">${s.captionY == null ? '· automática' : ''}</span></label><input type="range" id="e-capy" min="0.12" max="0.9" step="0.01" value="${s.captionY ?? (this.prev?.R ? this.prev.R.capY / this.prev.R.H : .7)}"></div>
        ${s.captionY != null ? `<button class="btn sm ghost" data-ed="capauto">Volver a posición automática</button>` : ''}
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><h3 class="h">Transcripción</h3><button class="btn sm" data-ed="regen" ${editable ? '' : 'disabled'}>${icon('refresh', 'sm')}Regenerar subtítulos</button></div>
        <p class="hint" style="margin:0 0 10px">Haz clic en una palabra para corregirla. Vacía una palabra para quitarla.</p>
        <div class="words" id="words">${words.map(w => `<input data-wi="${j.transcript.words.indexOf(w)}" data-s="${w.s}" value="${esc(w.w)}" size="${Math.max(1, w.w.length)}" class="${w.orig ? 'edited' : ''}" ${editable ? '' : 'disabled'}>`).join('')}</div>
      </div>
      <div class="card actions">
        <button class="btn primary wide" data-ed="render" ${editable && !c.discarded ? '' : 'disabled'}>${icon('film', 'sm')}${c.status === 'ready' ? 'Volver a exportar' : 'Exportar MP4'}</button>
        <button class="btn" data-ed="download" ${c.status === 'ready' ? '' : 'disabled'}>${icon('download', 'sm')}Descargar</button>
        <button class="btn" data-ed="discard">${c.discarded ? icon('refresh', 'sm') + 'Restaurar' : icon('trash', 'sm') + 'Descartar'}</button>
      </div>`;
  },
  touch(needsTrack) {
    const c = this.clip;
    if (needsTrack) { c.track = undefined; c._needsTrack = true; }
    if (c.status === 'ready') c.status = 'stale';
    clearTimeout(this.saveT); this.saveT = setTimeout(() => saveJob(this.job), 300);
    this.prev?.refresh(); this.drawList();
  },
  async act(e) {
    const b = e.target.closest('[data-ed]'); if (!b || b.disabled) return;
    const c = this.clip, j = this.job, s = c?.settings, a = b.dataset.ed;
    if (a === 'pick' && !e.target.closest('[data-ed=sel]')) { if (b.dataset.c !== c?.id) { history.replaceState(null, '', `#/job/${j.id}/${b.dataset.c}`); this.prev?.pause(); this.clip = j.clips.find(x => x.id === b.dataset.c); this.drawList(); this.drawStage(); this.drawPanel(); } return; }
    if (a === 'sel') { const k = j.id + ':' + b.dataset.c; S.selected.has(k) ? S.selected.delete(k) : S.selected.add(k); this.drawList(); this.topbar(); return; }
    if (a === 'zip') { const sel = j.clips.filter(x => S.selected.has(j.id + ':' + x.id)), nr = sel.filter(x => x.status !== 'ready').length; if (nr) toast(`${nr} clip(s) seleccionados aún no están exportados y no se incluirán`, 'warn'); return zipSelected(sel.map(x => ({ j, c: x }))); }
    if (a === 'render-all') { const ids = j.clips.filter(x => !x.discarded && x.status !== 'ready').map(x => x.id); if (!ids.length) return toast('Todos los clips están exportados', 'ok'); Queue.add({ kind: 'render', jobId: j.id, clipIds: ids }); this.drawList(); this.topbar(); return; }
    if (a === 'tab') { this.prev?.pause(); this.tab = b.dataset.v; return this.drawStage(); }
    if (a === 'safe') { this.safe = !this.safe; $('#safe')?.classList.toggle('on', this.safe); return; }
    if (a === 'play') { if (!this.prev) return; this.prev.playing ? this.prev.pause() : this.prev.play(); return; }
    if (a === 'nudge') { const inp = $('#' + b.dataset.f); inp.value = (+inp.value + +b.dataset.d).toFixed(2); return this.setBounds(); }
    if (a === 'refit') { const t = clamp(+$('#e-target').value || 30, 5, 600); const r = refitClip(j, c, t); if (r) { c.start = r.start; c.end = r.end; c.deviation = Math.abs(r.d - t) / t > .15 ? `Duración ${r.d.toFixed(1)} s frente a ${t} s pedidos: se ha priorizado no cortar frases.` : null; this.touch(true); this.drawPanel(); this.prev?.seekOut(0); toast(`Clip reajustado a ${r.d.toFixed(1)} s`, 'ok', 2000); } return; }
    if (a === 'aspect') { s.aspect = b.dataset.v; this.touch(true); this.drawStage(); this.drawPanel(); return; }
    if (a === 'framing') { s.framing = b.dataset.v; this.touch(s.framing === 'auto' && c.track === null ? false : s.framing === 'auto' && !c.track); this.drawPanel(); return; }
    if (a === 'style') { s.style = b.dataset.v; this.touch(); this.drawPanel(); return; }
    if (a === 'capauto') { s.captionY = null; this.touch(); this.drawPanel(); return; }
    if (a === 'regen') { s.captionY = null; this.touch(); this.prev?.refresh(); this.drawPanel(); toast('Subtítulos regenerados con la transcripción corregida', 'ok', 2500); return; }
    if (a === 'render') { this.prev?.pause(); Queue.add({ kind: 'render', jobId: j.id, clipIds: [c.id] }); this.drawPanel(); this.topbar(); return; }
    if (a === 'download') return downloadClip(j, c);
    if (a === 'discard') { c.discarded = !c.discarded; if (c.discarded) S.selected.delete(j.id + ':' + c.id); await saveJob(j); this.drawList(); this.drawPanel(); renderChrome(); return; }
  },
  topbar() { const j = this.job; const nSel = j.clips.filter(c => S.selected.has(j.id + ':' + c.id)).length; const z = $('[data-ed=zip]'); if (z) { z.disabled = !nSel; z.innerHTML = `${icon('archive', 'sm')}ZIP seleccionados${nSel ? ` (${nSel})` : ''}`; } const r = $('[data-ed=render-all]'); if (r) r.disabled = Queue.busyWith(j.id) || !j.source.fileId; },
  setBounds() {
    const c = this.clip, words = this.job.transcript.words;
    let st = +$('#e-start').value, en = +$('#e-end').value;
    if (!isFinite(st) || !isFinite(en)) return;
    st = clamp(st, 0, (this.job.source.duration || 1e9) - 1); en = clamp(en, st + 1, this.job.source.duration || 1e9);
    // no cortar palabras: si un límite cae dentro de una palabra, se amplía hasta su borde
    for (const w of words) { if (st > w.s && st < w.e) st = Math.max(0, w.s); if (en > w.s && en < w.e) en = w.e; }
    c.start = +st.toFixed(3); c.end = +en.toFixed(3);
    $('#e-start').value = c.start.toFixed(2); $('#e-end').value = c.end.toFixed(2);
    this.touch(true); this.prev?.seekOut(0);
    clearTimeout(this.panelT); this.panelT = setTimeout(() => { const a = document.activeElement?.id; this.drawPanel(); if (a) $('#' + a)?.focus(); }, 700);
  },
  input(e) {
    const t = e.target, c = this.clip, s = c?.settings; if (!s) return;
    if (t.id === 'e-off') { s.offsetX = +t.value; this.touch(); }
    if (t.id === 'e-capy') { s.captionY = +t.value; this.touch(); }
    if (t.dataset.wi) t.size = Math.max(1, t.value.length);
  },
  change(e) {
    const t = e.target, c = this.clip, s = c?.settings; if (!s) return;
    if (t.id === 'e-start' || t.id === 'e-end') return this.setBounds();
    if (t.id === 'e-sil') { s.removeSilence = t.checked; this.touch(); this.drawPanel(); }
    if (t.id === 'e-norm') { s.normalize = t.checked; this.touch(); this.prev?.rewire(); }
    if (t.id === 'e-caps') { s.captions = t.checked; this.touch(); }
    if (t.id === 'e-capy') this.drawPanel();
    if (t.dataset.wi) {
      const w = this.job.transcript.words[+t.dataset.wi]; if (!w) return;
      const v = t.value.trim().replace(/\s+/g, ' ');
      if (v !== w.w) { if (!w.orig) w.orig = w.w; w.w = v; t.classList.add('edited'); this.touch(); }
    }
  },
  onJob(job, clip) {
    if (job !== this.job) return;
    if (!this.clip && job.clips?.length) return route();
    if (clip && clip.status === 'rendering') { const el = $(`.cl[data-c="${clip.id}"] .r:last-child`); if (el) el.innerHTML = `<span class="badge live">Exportando ${Math.round((clip.renderProgress || 0) * 100)} %</span>`; return; }
    this.drawList(); this.topbar();
    const run = $('#ed-run'); if (run) { if (job.status === 'running') run.lastElementChild.textContent = job.message; else run.remove(); }
    if (!clip || clip === this.clip) { const a = document.activeElement; if (!a || !$('#ed-panel')?.contains(a)) this.drawPanel(); if (clip === this.clip && clip.status === 'ready' && this.tab === 'final') this.drawStage(); }
  },
  destroy() { this.prev?.destroy(); this.prev = null; closeVideo(this.video); this.video = null; if (this.finalUrl) URL.revokeObjectURL(this.finalUrl); },
};
Views.job = { wide: true, render: (el, id, cid) => Editor.render(el, id, cid) };

/* ---------------- arranque ---------------- */
(async function boot() {
  try { await DB.open(); await loadState(); }
  catch (e) { $('#view').innerHTML = `<div class="card empty"><div class="ic">${icon('alert', 'lg')}</div><b>No se puede usar el almacenamiento local</b><span>Chrome está bloqueando IndexedDB (¿ventana de incógnito o almacenamiento desactivado?). ClipForge lo necesita para guardar vídeos y clips.</span></div>`; return; }
  try { await navigator.storage?.persist?.(); } catch {}
  S.gpu = false; navigator.gpu?.requestAdapter().then(a => { S.gpu = !!a; renderChrome(); }).catch(() => {});
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', e => { if (Queue.running) { e.preventDefault(); e.returnValue = ''; } });
  refreshStorage().then(renderChrome);
  route();
  Helper.health().then(() => { if (['inicio', 'crear'].includes(current.name) && !$('#create-form')?.contains(document.activeElement)) { const sc = $('#main').scrollTop; route(); $('#main').scrollTop = sc; } });
  setInterval(() => { if (!Queue.running) Helper.health(); }, 30000);
  window.ClipForge = { S, Queue, findMoments, parseSubtitles, parseYouTube, version: VERSION, _int: { ClipRenderer, layoutCaptions, clipWords, buildSentences } };
})();
</script>
